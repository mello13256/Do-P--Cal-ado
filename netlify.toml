# Configuração de publicação na Netlify.
# Com este arquivo, a Netlify preenche tudo sozinha ao importar o repositório.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# O site é uma SPA: qualquer endereço (/produtos, /admin…) devolve o index.html
# e o roteador cuida do resto.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
